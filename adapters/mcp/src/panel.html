<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAM</title>
<!-- The SAAM panel, an MCP App (see server.mjs). The chat host shows it in a
     sandboxed frame with maker_onboarding's result, whose _meta names the relay
     and this session's panel key. It shows one light for the session and posts
     each queued Studio request into the chat, so the chat needs no listener. -->
<style>
:root{--text:#1d1d1f;--muted:#6b6b70;--bg:#ffffff;--done:#1f9d55;--working:#d98e04;--error:#d0312d;--link:#0b63c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#f2f2f2;--muted:#a1a1a6;--bg:#1b1b1d;--done:#3ccf7a;--working:#f0b429;--error:#ff6b61;--link:#6aa9ff}}
:root[data-theme="dark"]{--text:#f2f2f2;--muted:#a1a1a6;--bg:#1b1b1d;--done:#3ccf7a;--working:#f0b429;--error:#ff6b61;--link:#6aa9ff}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;min-width:0}
#light{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--working)}
#light[data-state="done"]{background:var(--done)}
#light[data-state="error"]{background:var(--error)}
#light[data-state="working"]{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#light[data-state="working"]{animation:none}}
strong{flex:none;font-weight:600}
#text{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{flex:none;font:inherit;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
button[hidden]{display:none}
</style>
</head>
<body>
<main>
  <span id="light" data-state="working" aria-hidden="true"></span>
  <strong>SAAM</strong>
  <span id="text" role="status" aria-live="polite">Connecting…</span>
  <button id="studio" type="button" hidden title="Opens Studio on the computer running SAAM">Open Studio</button>
</main>
<script>
'use strict';
const PROTOCOL='2026-01-26',RETRY_MS=[2000,30000],PING_MS=25000,POST_RETRY_MS=10000;
// 4001: this chat's session ended; 4403: the key was refused. Neither retries.
const FINAL_CLOSES=new Set([4001,4403]);
const $=id=>document.getElementById(id);
const panel={relay:null,key:null,socket:null,retry:null,ping:null,backoff:RETRY_MS[0],studio:null,
  queued:[],posted:new Set(),posting:new Set(),nextId:1,replies:new Map()};

// JSON-RPC with the chat host over postMessage.
function send(message){window.parent.postMessage({jsonrpc:'2.0',...message},'*');}
function request(method,params){
  const id=panel.nextId++;
  return new Promise((resolve,reject)=>{panel.replies.set(id,{resolve,reject});send({id,method,params});});
}
function notify(method,params){send({method,params});}
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  const message=event.data;if(!message||message.jsonrpc!=='2.0')return;
  if(message.id!==undefined&&!message.method){
    const reply=panel.replies.get(message.id);if(!reply)return;panel.replies.delete(message.id);
    if(message.error)reply.reject(Error(message.error.message??'The chat refused.'));else reply.resolve(message.result);
    return;
  }
  if(message.method==='ui/notifications/tool-result')received(message.params);
  else if(message.method==='ui/notifications/host-context-changed')theme(message.params);
  else if(message.method==='ui/resource-teardown'){stop();send({id:message.id,result:{}});}
  else if(message.id!==undefined)send({id:message.id,result:{}});
});

function theme(context){if(context?.theme)document.documentElement.dataset.theme=context.theme;}
function resize(){notify('ui/notifications/size-changed',{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight});}
function show(state,text){
  $('light').dataset.state=state;$('text').textContent=text;$('text').title=text;
  $('studio').hidden=!panel.studio;resize();
}

// maker_onboarding's result names the relay and this session's key.
function received(result){
  const saam=result?._meta?.['saam/panel'];
  if(!saam?.relay||!saam?.key){show('error','This chat did not pass SAAM its connection.');return;}
  if(saam.key===panel.key)return;
  stop();Object.assign(panel,{relay:saam.relay,key:saam.key,backoff:RETRY_MS[0]});
  connect();
}
function connect(){
  const url=new URL('/panel',panel.relay);url.protocol=url.protocol==='https:'?'wss:':'ws:';
  const socket=new WebSocket(url);panel.socket=socket;
  // The key travels in the first message, never in the address.
  socket.onopen=()=>{
    socket.send(JSON.stringify({type:'hello',key:panel.key}));
    panel.ping=setInterval(()=>socket.send('ping'),PING_MS);
  };
  socket.onmessage=({data})=>{
    if(data==='pong')return;
    let packet;try{packet=JSON.parse(data);}catch{return;}
    if(packet.type==='status'){panel.backoff=RETRY_MS[0];status(packet);}
  };
  socket.onclose=({code,reason})=>{
    clearInterval(panel.ping);if(panel.socket!==socket)return;panel.socket=null;
    if(FINAL_CLOSES.has(code)){show('error',reason||'This chat’s SAAM session ended.');return;}
    show('error',reason||'Lost the connection to SAAM. Reconnecting…');
    panel.retry=setTimeout(connect,panel.backoff);panel.backoff=Math.min(panel.backoff*2,RETRY_MS[1]);
  };
}
function stop(){
  clearTimeout(panel.retry);clearInterval(panel.ping);
  const socket=panel.socket;panel.socket=null;socket?.close(1000);
}
function status({state,text,requests=[],studio=null}){
  panel.studio=studio;panel.queued=requests;show(['done','working','error'].includes(state)?state:'error',text||state);
  for(const queued of requests)post(queued);
}
// A queued Studio request becomes a chat message; one the chat refuses, as
// during a turn, is tried again while it stays queued.
async function post(queued){
  if(panel.posted.has(queued.id)||panel.posting.has(queued.id))return;
  panel.posting.add(queued.id);
  const where=queued.printId?`, print ${queued.printId}`:'';
  const text=`SAAM Studio request (requestId ${queued.id}${where}): ${queued.instruction}`;
  try{await request('ui/message',{role:'user',content:[{type:'text',text}]});panel.posted.add(queued.id);panel.posting.delete(queued.id);}
  catch{setTimeout(()=>{panel.posting.delete(queued.id);const still=panel.queued.find(r=>r.id===queued.id);if(still)post(still);},POST_RETRY_MS);}
}

$('studio').addEventListener('click',()=>{if(panel.studio)request('ui/open-link',{url:panel.studio}).catch(()=>{});});
request('ui/initialize',{protocolVersion:PROTOCOL,appInfo:{name:'SAAM',version:'1'},appCapabilities:{availableDisplayModes:['inline']}})
  .then(result=>{theme(result?.hostContext);notify('ui/notifications/initialized',{});resize();})
  .catch(()=>show('error','This chat cannot show the SAAM panel.'));
</script>
</body>
</html>
