name: prepared repository downloads

# Distribution builds are explicit. The required PR test remains in test.yml.
on:
  workflow_dispatch:
    inputs:
      check_source:
        description: Also check first use from a source-only download
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, platform: win32, arch: x64, extension: zip}
          - {os: windows-11-arm, platform: win32, arch: arm64, extension: zip}
          - {os: macos-15, platform: darwin, arch: arm64, extension: tar.gz}
          - {os: macos-15-intel, platform: darwin, arch: x64, extension: tar.gz}
          - {os: ubuntu-24.04, platform: linux, arch: x64, extension: tar.gz}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64, extension: tar.gz}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check source download when bootstrap changed
        if: inputs.check_source
        run: node scripts/test-first-run.mjs --source
      - name: Build archive with verified runtime and locked dependencies
        run: node scripts/package-bundle.mjs
      - name: Check extracted archive without installation downloads
        run: node scripts/test-first-run.mjs --archive dist/SAAM-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: SAAM-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/SAAM-*
            dist/first-run-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: first-run-failure-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/first-run-*.json
          if-no-files-found: ignore
