name: repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Reuse successful checks for this exact commit
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'test.yml', head_sha: context.sha, per_page: 100
            });
            let passed = false;
            for (const run of runs) {
              if (run.id === context.runId || run.status !== 'completed' || run.conclusion !== 'success') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100
              });
              if (jobs.some(job => job.name === 'test' && job.conclusion === 'success')) { passed = true; break; }
            }
            core.setOutput('passed', String(passed));
            if (passed) core.notice('The repository workflow already passed for this exact commit; reusing its result.');
      - uses: actions/checkout@v5
        if: steps.prior.outputs.passed != 'true'
      - uses: actions/setup-node@v5
        if: steps.prior.outputs.passed != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.prior.outputs.passed != 'true'
      - run: npm test
        if: steps.prior.outputs.passed != 'true'
