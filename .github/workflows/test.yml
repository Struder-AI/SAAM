name: runtime setup

# main requires the `test` status. Exercise each fresh runner once; regression
# selection belongs to the change. PRs get one run, without duplicate push runs.
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:check
