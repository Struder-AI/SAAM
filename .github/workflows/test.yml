name: test

# What CONTRIBUTING.md and AGENTS.md's "Contributing it upstream" section
# both point to as the actual enforcement behind "npm test passes" and
# "the registry is regenerated" — a PR that fails this doesn't merge, and
# a maintainer isn't relying on remembering to run these commands by hand.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
