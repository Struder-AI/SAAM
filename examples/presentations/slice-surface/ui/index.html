<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAAM · Slice animation</title><link rel="stylesheet" href="/style.css"></head>
<body><main><section class="viewer"><canvas id="scene" width="1920" height="1080" aria-label="SAAM Studio window showing the changing slice"></canvas><div class="transport"><button id="play" disabled>Play</button><button id="restart">↶</button><input id="timeline" aria-label="Animation timeline" type="range" min="0" max="2370" value="0"><output id="time">0.0 / 79.0 s</output><button id="fullscreen">Full screen</button></div><div class="actions"><label><input id="context" type="checkbox" checked> Context layers</label><label><input id="wash" type="checkbox" checked> Surface wash</label><button id="movie" disabled>Export video</button><button id="still">Save still</button><button id="cancel" hidden>Cancel</button><progress id="progress" max="2370" value="0" hidden></progress></div><div id="status" role="status">Loading animation…</div><div id="error" role="alert" hidden></div></section>
<div hidden><button id="build">Load frames</button><button id="save">Save cache</button><button id="load">Open cache</button><input id="cache-file" type="file" accept=".json,.gz"><button id="snapshot">Save snapshot</button><p id="snapshot-result"></p><div data-saam-workspace-info></div></div></main><script type="module" src="/app.mjs"></script></body></html>
